### ─────────────────────────────
### Plugins
### ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'niksingh710/minimal-tmux-status'

### Minimal Status
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-right false
set -g @minimal-tmux-indicator-str '#S'

### ─────────────────────────────
### Vim-Tmux Navigator
### ─────────────────────────────
# Smart pane switching with Vim awareness
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(\.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind -n C-\\ if-shell \"$is_vim\" 'send-keys C-\\' 'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind -n C-\\ if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

# Copy mode pane navigation
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi C-\\ select-pane -l

### ─────────────────────────────
### General Settings
### ─────────────────────────────
set -a terminal-features "screen-256color:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g default-shell "/bin/zsh"
set -g status-keys vi
set -g mode-keys vi
set -g mouse on
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -sg escape-time 10
set -g history-limit 2000
set -gq allow-passthrough on

### ─────────────────────────────
### Prefix & Keybindings
### ─────────────────────────────
unbind C-b
set -g prefix C-Space
bind  -N "Send the prefix key through to the application" C-Space send-prefix

# Create new panes in the same working directory
bind v split-window -hc "#{pane_current_path}"
bind '|' split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Popup Lazygit
bind g popup -E -w 90% -h 90% "lazygit"
bind "c-g" popup -E -w 90% -h 90% "lazygit"

# Sesh session switcher
bind "c-o" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Ranger session switcher
bind "c-r" popup -E -w 90% -h 90% "zsh -ic ranger_sesh"

# Kill pane without prompt
bind x kill-pane

### ─────────────────────────────
### TPM Init (Keep at bottom)
### ─────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
