# macOS: send Alt/Meta, not special characters (for example, Option-r types ®).
macos_option_as_alt yes

font_family      family="Jetbrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

cursor_blink_interval 0

mouse_hide_wait 10.0
url_style double

enable_audio_bell no

background_opacity 1
hide_window_decorations titlebar-only
window_padding_width 10

tab_bar_edge top
tab_bar_margin_width 4
tab_bar_margin_height 4 0
tab_bar_style separator
tab_separator ""
tab_bar_min_tabs 2
tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_title_template " ({index}) {tab.active_oldest_exe} "
active_tab_font_style bold

# Do not ask for confirmation when a tab or a window closes.
confirm_os_window_close 0

action_alias launch_tab launch --type=tab --cwd=current

kitty_mod super+shift
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5

map super+t launch_tab

enabled_layouts splits:split_axis=horizontal splits:split_axis=vertical
map kitty_mod+\ launch --cwd=current --location=vsplit
map kitty_mod+' launch --cwd=current --location=hsplit
map super+h neighboring_window left
map super+l neighboring_window right
map super+k neighboring_window up
map super+j neighboring_window down

map kitty_mod+h move_window left
map kitty_mod+l move_window right
map kitty_mod+k move_window up
map kitty_mod+j move_window down

include theme.conf
