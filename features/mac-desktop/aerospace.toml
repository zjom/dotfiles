# The aerospace node (aerospace.nix) gives this file to AeroSpace.
# AeroSpace ignores ~/.aerospace.toml.

# Use this option to add commands that run after the login to the macOS user
# session.
# 'after-login-command' works only if 'start-at-login' is 'true'.
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# Use this option to add commands that run after AeroSpace starts.
# 'after-startup-command' runs after 'after-login-command'.
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login. The value stays false because the Home Manager
# launchd agent starts AeroSpace. The value true registers a second login item,
# which starts a second copy.
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# 'accordion-padding' sets the size of the accordion padding.
# To disable the padding, set 0.
accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = "tiles"

# Possible values: horizontal|vertical|auto
# 'auto' means: a wide monitor (wider than high) gets the horizontal orientation,
#               and a tall monitor (higher than wide) gets the vertical orientation.
default-root-container-orientation = "auto"

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = "qwerty"

# The mouse follows the focus when the focused monitor changes.
# If you do not want this behaviour, remove this option.
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focus-changed = ["move-mouse window-lazy-center"]
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

# Gaps between windows (inner-*) and between the windows and the monitor edges
# (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is the default value if no pattern matches.
#                 The monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors

# exec-and-forget gets the minimal PATH of launchd. That PATH does not contain
# the Nix profiles.
[exec.env-vars]
PATH = "/etc/profiles/per-user/${USER}/bin:/run/current-system/sw/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}"

[gaps]
inner.horizontal = 8
inner.vertical = 0
outer.left = 2
outer.right = 2
outer.top = 0
outer.bottom = 0

# The declaration of the 'main' binding mode.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# The 'main' binding mode must always exist.
[mode.main.binding]
# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# default.nix binds alt-q and alt-space, which start kitty.
alt-b = "exec-and-forget open -a safari"
alt-shift-b = "exec-and-forget open -a 'google chrome'"
alt-m = "exec-and-forget open -a messages"

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = "resize smart -50"
alt-shift-equal = "resize smart +50"

# See: https://nikitabobko.github.io/AeroSpace/commands#volume
alt-f10 = "volume mute-toggle"
alt-f11 = "volume down"
alt-f12 = "volume up"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"
alt-shift-6 = "move-node-to-workspace 6"
alt-shift-7 = "move-node-to-workspace 7"
alt-shift-8 = "move-node-to-workspace 8"
alt-shift-9 = "move-node-to-workspace 9"

alt-f = "macos-native-fullscreen"
alt-shift-f = "layout floating tiling"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = "workspace-back-and-forth"
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = "mode service"

# The declaration of the 'service' binding mode.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"] # reset the layout
# s = ['layout sticky tiling', 'mode main'] # AeroSpace does not support sticky yet: https://github.com/nikitabobko/AeroSpace/issues/2
f = ["layout floating tiling", "mode main"] # Toggle between the floating layout and the tiling layout
backspace = ["close-all-windows-but-current", "mode main"]

alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]

# Window callbacks.
# See: https://nikitabobko.github.io/AeroSpace/guide#callbacks
[[on-window-detected]]
if.app-id = "com.apple.systempreferences"
check-further-callbacks = true
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.finder"
check-further-callbacks = true
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.MobileSMS"
check-further-callbacks = true
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "ch.sudo.cyberduck"
check-further-callbacks = true
run = ["layout floating"]

[[on-window-detected]]
if.window-title-regex-substring = "float"
check-further-callbacks = true
run = ["layout floating"]
