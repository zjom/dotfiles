# ===================================================================
# This file contains the startup commands for ranger. The ranger node
# (modules/nodes/ranger.nix) passes this directory to ranger with --confdir.
# This file is based on the default rc.conf of ranger.
#
# This file contains all default commands. Thus, you can set the environment
# variable RANGER_LOAD_DEFAULT_RC to FALSE, so that ranger does not load the
# default commands two times.
#
# This file defines keybindings and settings. For more complex Python code,
# create a plugin in "plugins/" or a command in "commands.py".
#
# ranger runs each line as a command before it initializes the user interface.
# Thus, you cannot use commands that need the user interface, for example
# :delete or :mark.
# ===================================================================

# ===================================================================
# == Options
# ===================================================================

# The view mode. Possible values:
#     miller: Miller columns, which show multiple levels of the hierarchy.
#     multipane: A multipane view similar to Midnight Commander. This view
#                shows all tabs next to each other.
set viewmode miller
#set viewmode multipane

# The number of columns and their relative widths.
set column_ratios 1,3,4

# The files to hide (a regular expression).
set hidden_filter ^\.|\.(?:pyc|pyo|bak|swp)$|^lost\+found$|^__(py)?cache__$

# Show hidden files. To toggle this option, type 'zh'.
set show_hidden false

# Ask for confirmation when you run the "delete" command.
# Valid values are "always", "never" and "multiple" (default).
# With "multiple", ranger asks only if you delete more than one file.
set confirm_on_delete multiple

# A different path for the file preview script. ranger includes scope.sh. This
# script calls external programs to preview images, archives and other files.
# For the dependencies, see README.md of ranger.
#set preview_script ~/.config/ranger/scope.sh

# Use the external preview script. If the value is false, show simple text or
# image previews.
set use_preview_script true

# Count the files in each directory automatically, before you enter the
# directory.
set automatically_count_files true

# Open all images in this directory when you run some image viewers, for
# example feh or sxiv. To open only some files, mark these files.
set open_all_images true

# Detect version control systems and show their information.
set vcs_aware false

# The state of each of the four backends: git, hg, bzr and svn. The possible
# states are disabled, local (show only local information) and enabled (show
# local information and remote information).
set vcs_backend_git enabled
set vcs_backend_hg disabled
set vcs_backend_bzr disabled
set vcs_backend_svn disabled

# The maximum length of a commit message in the status bar.
set vcs_msg_length 50

# Use one of the supported image preview protocols.
set preview_images true

# The method for image previews. Supported methods:
#
# * w3m (default):
#   Previews images in full colour with the external command "w3mimgpreview".
#   This method needs the console web browser "w3m" and a supported terminal.
#   This method works in "xterm" and in "urxvt" without tmux.
#
# * iterm2:
#   Previews images in full colour with the image previews of iTerm2
#   (http://iterm2.com/images.html). This method needs an iTerm2 build with
#   image preview support.
#
#   This method uses the dimensions of the terminal font. By default, the
#   width is 8 and the height is 11. To use other values, set the options
#   iterm2_font_width and iterm2_font_height.
#
# * terminology:
#   Previews images in full colour in the terminology terminal emulator.
#   This method supports many formats, including vector graphics such as SVG.
#
# * urxvt:
#   Previews images in full colour with urxvt image backgrounds. This method
#   needs an urxvt build with pixbuf support.
#
# * urxvt-full:
#   The same as urxvt, but this method uses the full terminal window, not only
#   the preview pane.
#
# * kitty:
#   Previews images in full colour with the kitty image protocol.
#   This method needs the Python library PIL or pillow.
#   If ranger and kitty do not share the local file system, ranger encodes
#   the full image for the transfer. This transfer is slower, but this
#   transfer allows remote previews, for example in an SSH session.
#   This method does not support tmux.
#
# * ueberzug:
#   Previews images in full colour with the external command "ueberzug".
#   This method shows the images in a child window.
#   This method works only with X11 on GNU/Linux.
set preview_images_method kitty

# The delay, in seconds, before ranger shows an image with the w3m method.
# If the display is corrupted, increase this value.
set w3m_delay 0.02

# Adjust the w3mimg offset manually, for terminals that need an adjustment.
set w3m_offset 0

# The default font size for iTerm2 (see: preview_images_method: iterm2).
set iterm2_font_width 8
set iterm2_font_height 11

# Use a Unicode "..." character to mark truncated file names.
set unicode_ellipsis false

# BIDI support: show file names in RTL languages (Hebrew, Arabic) correctly.
# This option needs the python-bidi pip package.
set bidi_support false

# Show dotfiles in the bookmark preview box.
set show_hidden_bookmarks true

# The colour scheme. These colour schemes are available by default:
# default, jungle, snow, solarized
set colorscheme default

# Preview files in the rightmost column.
# If there is nothing to preview, make the last column smaller.
set preview_files true
set preview_directories true
set collapse_preview true

# Wrap long lines in plain text previews.
set wrap_plaintext_previews false

# Save the console history when ranger exits.
set save_console_history true

# Draw the status bar at the top of the browser window (default: bottom).
set status_bar_on_top false

# Draw a progress bar in the status bar. The progress bar shows the average
# state of all running tasks that support progress bars.
set draw_progress_bar_in_status_bar true

# Draw borders around the columns: separators, outline, both or none.
# Separators are vertical lines between the columns.
# Outline draws a box around all columns.
# Both combines separators and outline.
set draw_borders none

# Show the directory name in the tabs.
set dirname_in_tabs false

# Enable mouse support.
set mouse_enabled true

# Show the file size in the main column or in the status bar.
set display_size_in_main_column true
set display_size_in_status_bar true

# Show the free disk space in the status bar.
set display_free_space_in_status_bar true

# Show file tags in all columns. If the value is false, show file tags only in
# the main column.
set display_tags_in_all_columns true

# Set a title for the window. This option updates `WM_NAME` and `WM_ICON_NAME`.
set update_title false

# Set the window name of tmux or screen to "ranger".
set update_tmux_title true

# Shorten the title if the title is long. The number is the number of
# directories that the title shows. The value 0 disables this option.
set shorten_title 3

# Show the hostname in the title bar.
set hostname_in_titlebar true

# Replace $HOME with ~ in the title bar (the first line) of ranger.
set tilde_in_titlebar false

# The number of directory changes and console commands in the history.
set max_history_size 20
set max_console_history_size 50

# The space between the cursor and the top or bottom border when you scroll.
set scroll_offset 8

# Clear the input after each key press. This option has an effect when ranger is
# slow.
set flushinput true

# Padding on the right side when there is no preview.
# You can click into this space to run the file.
set padding_right true

# Save the bookmarks (used with mX and `X) immediately.
# This option keeps the bookmarks synchronized between multiple ranger
# instances, but this option decreases the performance slightly.
# If the value is false, ranger saves the bookmarks when it exits.
set autosave_bookmarks true

# Save the "`" bookmark to disk. You can then type "``" to go to the last
# directory.
set save_backtick_bookmark true

# ranger can show the "real" cumulative size of directories. To show this
# size, use the command :get_cumulative_size or type "dc". The calculation of
# this size is slow, and ranger does not update the size automatically. To
# make ranger update the size automatically, enable this option:
set autoupdate_cumulative_size false

# This option is useful for screen readers:
set show_cursor false

# One of: size, natural, basename, atime, ctime, mtime, type, random
set sort natural

# More sort options.
set sort_reverse false
set sort_case_insensitive true
set sort_directories_first true
set sort_unicode false

# Enable this option if key combinations with the Alt key do not work.
# (This problem occurs mostly in xterm.)
set xterm_alt_key false

# Include the bookmarks in the cd command.
set cd_bookmarks true

# The case sensitivity of the tab completion of the cd command.
set cd_tab_case sensitive

# Use fuzzy tab completion with the "cd" command. For example,
# ":cd /u/lo/b<tab>" expands to ":cd /usr/local/bin".
set cd_tab_fuzzy false

# Do not preview files that are larger than this size, in bytes. To disable
# this option, use the value 0.
set preview_max_size 0

# ranger expands the sublists of key hint lists up to this size.
# For larger lists, ranger replaces the submaps with "...".
set hint_collapse_threshold 10

# Add the highlighted file to the path in the title bar.
set show_selection_in_titlebar true

# The time that ranger waits for user input, in milliseconds, with a
# resolution of 100 ms. A lower value decreases the delay of directory updates
# but increases the CPU load.
set idle_delay 2000

# If the value is true, the metadata manager module looks for a ".metadata.json"
# file only in the current directory. If the value is false, the module also
# searches all directories above the current directory.
set metadata_deep_search false

# Clear all filters when you leave a directory.
set clear_filters_on_dir_change false

# Line numbers in the main column.
# Possible values: false, absolute, relative.
set line_numbers false

# If line_numbers=relative, show the absolute line number on the current
# line.
set relative_current_zero false

# Start the line numbers at 1, not at 0.
set one_indexed false

# Save the tabs when ranger exits.
set save_tabs_on_exit false

# Enable scroll wrapping. If you move down from the last item, the cursor goes
# to the top. If you move up from the first item, the cursor goes to the bottom.
set wrap_scroll false

# Set global_inode_type_filter to nothing. Possible values: d for directories,
# f for files and l for symlinks.
set global_inode_type_filter

# Freeze the list of files to decrease I/O. This value must be 'false' at
# startup. To toggle the value, press F.
set freeze_files false

# Show file sizes in bytes, not in the default human-readable format.
set size_in_bytes false

# Show a warning at startup if the RANGER_LEVEL environment variable is
# greater than 0. This warning appears when you start ranger in a subshell
# that ranger started. The value "error" makes the warning more visible.
set nested_ranger_warning true

# ===================================================================
# == Local Options
# ===================================================================
# You can set local options that apply to only one directory.

# Example:
# setlocal path=~/downloads sort mtime

# ===================================================================
# == Command Aliases in the Console
# ===================================================================

alias e     edit
alias q     quit
alias q!    quit!
alias qa    quitall
alias qa!   quitall!
alias qall  quitall
alias qall! quitall!
alias setl  setlocal

alias filter     scout -prts
alias find       scout -aets
alias mark       scout -mr
alias unmark     scout -Mr
alias search     scout -rs
alias search_inc scout -rts
alias travel     scout -aefklst

# ===================================================================
# == Keys for the browser
# ===================================================================

# Basic
map     Q quitall
map     q quit
copymap q ZZ ZQ

map R     reload_cwd
map F     set freeze_files!
map <C-r> reset
map <C-l> redraw_window
map <C-c> abort
map <esc> change_mode normal
map ~ set viewmode!

map i display_file
map <A-j> scroll_preview 1
map <A-k> scroll_preview -1
map ? help
map W display_log
map w taskview_open
map S shell $SHELL

map :  console
map ;  console
map !  console shell%space
map @  console -p6 shell  %%s
map #  console shell -p%space
map s  console shell%space
map r  chain draw_possible_programs; console open_with%space
map f  console find%space
map cd console cd%space

map <C-p> chain console; eval fm.ui.console.history_move(-1)

# Change the line mode
map Mf linemode filename
map Mi linemode fileinfo
map Mm linemode mtime
map Mh linemode humanreadablemtime
map Mp linemode permissions
map Ms linemode sizemtime
map MH linemode sizehumanreadablemtime
map Mt linemode metatitle

# Tagging and marking
map t       tag_toggle
map ut      tag_remove
map "<any>  tag_toggle tag=%any
map <Space> mark_files toggle=True
map v       mark_files all=True toggle=True
map uv      mark_files all=True val=False
map V       toggle_visual_mode
map uV      toggle_visual_mode reverse=True

# Midnight Commander bindings
map <F1> help
map <F2> rename_append
map <F3> display_file
map <F4> edit
map <F5> copy
map <F6> cut
map <F7> console mkdir%space
map <F8> console delete
#map <F8> console trash
map <F10> exit

# Bindings for a keyboard with the Dvorak layout
map <UP>       move up=1
map <DOWN>     move down=1
map <LEFT>     move left=1
map <RIGHT>    move right=1
map <HOME>     move to=0
map <END>      move to=-1
map <PAGEDOWN> move down=1   pages=True
map <PAGEUP>   move up=1     pages=True
map <CR>       move right=1
#map <DELETE>   console delete
map <INSERT>   console touch%space

# Vim-like bindings
copymap <UP>       k
copymap <DOWN>     j
copymap <LEFT>     h
copymap <RIGHT>    l
copymap <HOME>     gg
copymap <END>      G
copymap <PAGEDOWN> <C-F>
copymap <PAGEUP>   <C-B>

map J  move down=0.5  pages=True
map K  move up=0.5    pages=True
copymap J <C-D>
copymap K <C-U>

# Jumps
map H     history_go -1
map L     history_go 1
map ]     move_parent 1
map [     move_parent -1
map }     traverse
map {     traverse_backwards
map )     jump_non

map gh cd ~
map ge cd /etc
map gu cd /usr
map gd cd /dev
map gl cd -r .
map gL cd -r %f
map go cd /opt
map gv cd /var
map gm cd /media
map gi eval fm.cd('/run/media/' + os.getenv('USER'))
map gM cd /mnt
map gs cd /srv
map gp cd /tmp
map gr cd /
map gR eval fm.cd(ranger.RANGERDIR)
map g/ cd /
map g? cd /usr/share/doc/ranger

# External programs
map E  edit
map du shell -p du --max-depth=1 -h --apparent-size
map dU shell -p du --max-depth=1 -h --apparent-size | sort -rh
map yp yank path
map yd yank dir
map yn yank name
map y. yank name_without_extension
map <C-G> shell sesh connect %d

# File system operations
map =  chmod

map cw console rename%space
map a  rename_append
map A  eval fm.open_console('rename ' + fm.thisfile.relative_path.replace("%", "%%"))
map I  eval fm.open_console('rename ' + fm.thisfile.relative_path.replace("%", "%%"), position=7)

map pp paste
map po paste overwrite=True
map pP paste append=True
map pO paste overwrite=True append=True
map pl paste_symlink relative=False
map pL paste_symlink relative=True
map phl paste_hardlink
map pht paste_hardlinked_subtree
map pd console paste dest=
map p`<any> paste dest=%any_path
map p'<any> paste dest=%any_path

map dD console delete
map dT console trash

map dd cut
map ud uncut
map da cut mode=add
map dr cut mode=remove
map dt cut mode=toggle

map yy copy
map uy uncut
map ya copy mode=add
map yr copy mode=remove
map yt copy mode=toggle

# Temporary workarounds
map dgg eval fm.cut(dirarg=dict(to=0), narg=quantifier)
map dG  eval fm.cut(dirarg=dict(to=-1), narg=quantifier)
map dj  eval fm.cut(dirarg=dict(down=1), narg=quantifier)
map dk  eval fm.cut(dirarg=dict(up=1), narg=quantifier)
map ygg eval fm.copy(dirarg=dict(to=0), narg=quantifier)
map yG  eval fm.copy(dirarg=dict(to=-1), narg=quantifier)
map yj  eval fm.copy(dirarg=dict(down=1), narg=quantifier)
map yk  eval fm.copy(dirarg=dict(up=1), narg=quantifier)

# Searching
map /  console search%space
map n  search_next
map N  search_next forward=False
map ct search_next order=tag
map cs search_next order=size
map ci search_next order=mimetype
map cc search_next order=ctime
map cm search_next order=mtime
map ca search_next order=atime

# Tabs
map <C-n>     tab_new
map <C-w>     tab_close
map <TAB>     tab_move 1
map <S-TAB>   tab_move -1
map <A-Right> tab_move 1
map <A-Left>  tab_move -1
map gt        tab_move 1
map gT        tab_move -1
map gn        tab_new
map gc        tab_close
map uq        tab_restore
map <a-1>     tab_open 1
map <a-2>     tab_open 2
map <a-3>     tab_open 3
map <a-4>     tab_open 4
map <a-5>     tab_open 5
map <a-6>     tab_open 6
map <a-7>     tab_open 7
map <a-8>     tab_open 8
map <a-9>     tab_open 9
map <a-r>     tab_shift 1
map <a-l>     tab_shift -1

# Sorting
map or set sort_reverse!
map oz set sort=random
map os chain set sort=size;      set sort_reverse=False
map ob chain set sort=basename;  set sort_reverse=False
map on chain set sort=natural;   set sort_reverse=False
map om chain set sort=mtime;     set sort_reverse=False
map oc chain set sort=ctime;     set sort_reverse=False
map oa chain set sort=atime;     set sort_reverse=False
map ot chain set sort=type;      set sort_reverse=False
map oe chain set sort=extension; set sort_reverse=False

map oS chain set sort=size;      set sort_reverse=True
map oB chain set sort=basename;  set sort_reverse=True
map oN chain set sort=natural;   set sort_reverse=True
map oM chain set sort=mtime;     set sort_reverse=True
map oC chain set sort=ctime;     set sort_reverse=True
map oA chain set sort=atime;     set sort_reverse=True
map oT chain set sort=type;      set sort_reverse=True
map oE chain set sort=extension; set sort_reverse=True

map dc get_cumulative_size

# Settings
map zc    set collapse_preview!
map zd    set sort_directories_first!
map zh    set show_hidden!
map <C-h> set show_hidden!
copymap <C-h> <backspace>
copymap <backspace> <backspace2>
map zI    set flushinput!
map zi    set preview_images!
map zm    set mouse_enabled!
map zp    set preview_files!
map zP    set preview_directories!
map zs    set sort_case_insensitive!
map zu    set autoupdate_cumulative_size!
map zv    set use_preview_script!
map zf    console filter%space
copymap zf zz

# Filter stack
map .d filter_stack add type d
map .f filter_stack add type f
map .l filter_stack add type l
map .m console filter_stack add mime%space
map .n console filter_stack add name%space
map .# console filter_stack add hash%space
map ." filter_stack add duplicate
map .' filter_stack add unique
map .| filter_stack add or
map .& filter_stack add and
map .! filter_stack add not
map .r filter_stack rotate
map .c filter_stack clear
map .* filter_stack decompose
map .p filter_stack pop
map .. filter_stack show

# Bookmarks
map `<any>  enter_bookmark %any
map '<any>  enter_bookmark %any
map m<any>  set_bookmark %any
map um<any> unset_bookmark %any

map m<bg>   draw_bookmarks
copymap m<bg>  um<bg> `<bg> '<bg>

# Generate all chmod bindings with Python:
eval for arg in "rwxXst": cmd("map +u{0} shell -f chmod u+{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map +g{0} shell -f chmod g+{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map +o{0} shell -f chmod o+{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map +a{0} shell -f chmod a+{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map +{0}  shell -f chmod u+{0} %s".format(arg))

eval for arg in "rwxXst": cmd("map -u{0} shell -f chmod u-{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map -g{0} shell -f chmod g-{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map -o{0} shell -f chmod o-{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map -a{0} shell -f chmod a-{0} %s".format(arg))
eval for arg in "rwxXst": cmd("map -{0}  shell -f chmod u-{0} %s".format(arg))

